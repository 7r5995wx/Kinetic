spring:
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:kinetic;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    properties:
      hibernate:
        dialect: ${HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

kinetic:
  allowed-origins:
    - ${ALLOWED_ORIGINS:http://localhost:3000}
