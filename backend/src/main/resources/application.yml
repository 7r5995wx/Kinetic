spring:
  application:
    name: kinetic-api
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${PORT:8080}
  shutdown: graceful
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:8h}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

kinetic:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  session-cookie-secure: ${SESSION_COOKIE_SECURE:false}
  session-cookie-same-site: ${SESSION_COOKIE_SAME_SITE:lax}
