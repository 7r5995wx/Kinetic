spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/kinetic}
    username: ${DATABASE_USERNAME:kinetic}
    password: ${DATABASE_PASSWORD}
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:false}
        http-only: true
        same-site: ${SESSION_COOKIE_SAME_SITE:lax}
