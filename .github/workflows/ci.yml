name: Kinetic CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend CI (Java 21 & PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: kinetic_test
          POSTGRES_USER: kinetic
          POSTGRES_PASSWORD: test-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run Maven Tests (PostgreSQL backed)
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/kinetic_test
          DATABASE_USERNAME: kinetic
          DATABASE_PASSWORD: test-ci-password
          HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
          SESSION_COOKIE_SECURE: false
          ALLOWED_ORIGINS: http://localhost:3000
        run: ./mvnw test

      - name: Package Spring Boot executable JAR
        run: ./mvnw package -DskipTests

  frontend:
    name: Frontend CI (Next.js & TypeScript)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies (reproducible)
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Run Unit & Integration tests
        run: npm test

      - name: Build Next.js production artifact
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
          NEXT_PUBLIC_BACKEND_URL: http://localhost:8080
          NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws
        run: npm run build
